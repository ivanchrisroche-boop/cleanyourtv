name: Build TV launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply settings for OnePlus Y Series (shibuya)
        run: |
          python3 - <<'PY'
          import re
          p = "launcher/app/src/main/res/values/config.xml"
          s = open(p, encoding="utf-8").read()
          dock = ["com.netflix.ninja", "com.amazon.amazonvideo.livingroom", "com.google.android.youtube.tv", "in.startv.hotstar"]
          body = "".join("\n        <item>%s</item>" % i for i in dock)
          new = '<string-array name="dock_apps">%s\n    </string-array>' % body
          s, n = re.subn(r'<string-array name="dock_apps">.*?</string-array>', new, s, count=1, flags=re.S)
          assert n == 1, "dock_apps"
          # This TV's Live TV app is com.mediatek.wwtv.tvcenter, which is already the project's default
          # for live_tv_package and hidden_apps, so nothing else is changed.
          assert 'name="live_tv_package" translatable="false">com.mediatek.wwtv.tvcenter<' in s
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build the APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
