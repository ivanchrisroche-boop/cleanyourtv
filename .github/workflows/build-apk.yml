name: Build TV launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply settings for Xiaomi MiTV-AXSO2
        run: |
          python3 - <<'PY'
          import re
          p = "launcher/app/src/main/res/values/config.xml"
          s = open(p, encoding="utf-8").read()
          dock = ["com.netflix.ninja", "com.amazon.amazonvideo.livingroom", "com.google.android.youtube.tv", "in.startv.hotstar"]
          hidden = ["com.android.tv", "com.mitv.gallery"]
          def block(name, items):
              body = "".join("\n        <item>%s</item>" % i for i in items)
              return '<string-array name="%s">%s\n    </string-array>' % (name, body)
          for name, items in (("dock_apps", dock), ("hidden_apps", hidden)):
              pat = r'<string-array name="%s">.*?</string-array>' % name
              s, n = re.subn(pat, block(name, items), s, count=1, flags=re.S)
              assert n == 1, name
          s, n = re.subn(r'(<string name="live_tv_package"[^>]*>)[^<]*(</string>)', r"\1com.android.tv\2", s, count=1)
          assert n == 1, "live_tv_package"
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build the APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
